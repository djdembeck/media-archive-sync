# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: system
        types: [python]
        pass_filenames: false
      - id: black-check
        name: Black format check
        entry: black --check .
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: Mypy type check
        entry: mypy src/
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: Pytest
        entry: pytest -v --tb=short
        language: system
        pass_filenames: false
        always_run: true
      # Validates workflow syntax + expression references. Unlike the CI-mirror
      # hooks above, this takes the changed filenames as arguments
      # (pass_filenames: true is correct here).
      - id: actionlint
        name: Actionlint
        entry: actionlint
        language: system
        files: '^.github/workflows/|^\.forgejo/workflows/'
        pass_filenames: true
        types: [yaml]
