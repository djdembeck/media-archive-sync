name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Always-on classifier: scopes each diff into per-concern flags so inert
  # (docs/config-only) changes skip the expensive jobs. No needs: — it is the
  # first thing that runs. A non-success classifier makes every downstream
  # `needs['changes'].result == 'success'` predicate skip (fail closed).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workflow: ${{ steps.classify.outputs.workflow }}
      lint: ${{ steps.classify.outputs.lint }}
      test: ${{ steps.classify.outputs.test }}
      docker: ${{ steps.classify.outputs.docker }}
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BEFORE: ${{ github.event.before }}
      SHA: ${{ github.sha }}
      REF: ${{ github.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the PR merge-base and push before..sha resolve.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        run: |
          # Writes exactly four `<flag>=true|false` lines to stdout, captured
          # into $GITHUB_OUTPUT as the job outputs. Exits 0 with all-true on
          # any "unable to classify" case (fail-safe full run); exits nonzero
          # only on a real infrastructure failure (fail closed).
          bash .ci/changes.sh > "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          WORKFLOW: ${{ steps.classify.outputs.workflow }}
          LINT: ${{ steps.classify.outputs.lint }}
          TEST: ${{ steps.classify.outputs.test }}
          DOCKER: ${{ steps.classify.outputs.docker }}
        run: |
          {
            echo '## changes'
            echo
            echo '```text'
            echo "workflow=${WORKFLOW:-<no output>}"
            echo "lint=${LINT:-<no output>}"
            echo "test=${TEST:-<no output>}"
            echo "docker=${DOCKER:-<no output>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Dedicated workflow-lint concern (never folded into lint-format): actionlint
  # the changed workflow files (full-history checkout so the PR merge-base
  # resolves) + run the committed classifier harness. Flag-gated on its own
  # `workflow` concern (classifier/harness/local-action/config changes set it).
  workflow-lint:
    name: Workflow lint
    needs: [changes]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # actionlint v1.7.12's go.mod requires go >= 1.25.0.
          go-version: '1.25'

      - name: Lint changed workflows
        run: |
          set -euo pipefail
          FILES_FILE="$(mktemp)"
          trap 'rm -f "$FILES_FILE"' EXIT
          # For a PR, lint only the workflow files the PR changed (ACM);
          # unresolvable merge-base or a non-PR event -> lint all tracked
          # workflow files (full run is the safe side).
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            if MB="$(git merge-base "$BASE" "$HEAD" 2>/dev/null)" && [ -n "$MB" ]; then
              git diff --name-only -z --no-renames --diff-filter=ACM "$MB" "$HEAD" \
                -- '.github/workflows' '.forgejo/workflows' > "$FILES_FILE"
            fi
          fi
          if [ ! -s "$FILES_FILE" ]; then
            git ls-files -z -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml' \
              '.forgejo/workflows/*.yml' '.forgejo/workflows/*.yaml' > "$FILES_FILE"
          fi
          if [ ! -s "$FILES_FILE" ]; then
            echo "No workflow files to lint"
            exit 0
          fi
          # actionlint's argv contains ONLY workflow YAML files; xargs -0 is
          # NUL-safe for filenames containing spaces. Pinned module version.
          xargs -0 go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 < "$FILES_FILE"

      - name: Run classifier harness
        run: |
          bash .ci/changes-test.sh

  lint-format:
    needs: [changes]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run black (check)
        run: black --check .

      - name: Run mypy
        run: mypy src/

  # Python is interpreted — there is no build/compile step, so there is no
  # separate build job; test chains directly off the lint-format gate.
  test:
    needs: [changes, workflow-lint, lint-format]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.test == 'true'
         && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped')
         && (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    needs: [changes, workflow-lint, lint-format, test]
    if: ${{ !cancelled() && needs['changes'].result == 'success' && needs['changes'].outputs.docker == 'true'
         && (needs['workflow-lint'].result == 'success' || needs['workflow-lint'].result == 'skipped')
         && (needs['lint-format'].result == 'success' || needs['lint-format'].result == 'skipped')
         && (needs['test'].result == 'success' || needs['test'].result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PR_IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || env.PR_IS_SAME_REPO == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find PR comment
        if: github.event_name == 'pull_request' && env.PR_IS_SAME_REPO == 'true'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: 'Docker image ready'

      - name: Create PR comment
        if: github.event_name == 'pull_request' && env.PR_IS_SAME_REPO == 'true' && steps.find-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🐳 Docker image ready

            A test image for this PR is available:

            ```bash
            docker pull ghcr.io/djdembeck/media-archive-sync:pr-${{ github.event.pull_request.number }}
            ```

            The `pr-${{ github.event.pull_request.number }}` tag is stable — new commits on this PR overwrite it with the latest build. The image is deleted automatically when the PR closes.
