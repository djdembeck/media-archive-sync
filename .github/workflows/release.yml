# Trunk flow — every push/merge to main releases.
#
# Generate-first release via annalist (GitHub Actions).
#
# How it works:
#   1. On every push to the trigger branch, the next version is auto-bumped
#      from commits since the last tag (conventional commits:
#      BREAKING CHANGE/feat! -> major, feat -> minor, else patch). Dispatch
#      with a `version` or `bump` input to override.
#   2. The pyproject.toml version is bumped to match the tag (idempotent) and
#      committed + pushed.
#   3. The tag is created and pushed (skipped if it already exists).
#   4. The release Docker image is built + pushed as ${REGISTRY}:${VERSION}
#      (idempotent — skipped when the image already exists).
#   5. The release is created via the gh CLI. The GitHub App fills release
#      notes via the release webhook (fill-after mode).
#
# Re-runs are idempotent: a partial failure can be re-dispatched and the same
# (already-existing) tag/release guards no-op or complete the work.

name: Release

on:
  push:
    branches: [main]
    # Release only on code changes — inert-only merges must not bump or cut.
    # Mirrors the ci.yml classifier inert set, EXCEPT no `*.md` entry: GitHub
    # path filters have no negation, and the Dockerfile COPYs README.md into
    # the image, so a README-only push is an image change and must release.
    # docs stay covered by docs/** and .github/**/*.md. No image-affecting
    # path (Dockerfile, pyproject.toml, src/) is filtered.
    paths-ignore:
      ['docs/**', 'renovate.json5', '.pre-commit-config.yaml', '.gitignore', '.editorconfig', 'LICENSE', '.env.example', '.github/**/*.md', 'Makefile', '.coderabbit.yaml']
  workflow_dispatch:
    inputs:
      version:                       # manual override
        description: "Explicit version (vX.Y.Z). Empty = auto-bump from commits."
        required: false
        default: ""
      bump:
        description: "Bump level when version is empty: auto|patch|minor|major"
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.new_version }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so version resolution can inspect all refs.
          fetch-depth: 0
          # KEEP persisted credentials (3a exception) — this workflow pushes
          # the version-bump commit and the tag; the job is scoped to
          # contents: write instead of disabling persistence.

      - name: Configure Git
        ## Annotated tags need a git identity; the runner ships none.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          BUMP_INPUT="${{ inputs.bump }}"

          LATEST_TAG="$(git tag -l 'v*.*.*' --sort=-version:refname | head -n 1 || true)"

          if [ -n "$VERSION_INPUT" ]; then
            # Manual override
            NEW_VERSION="${VERSION_INPUT#v}"
            if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version input: ${VERSION_INPUT} (expected vX.Y.Z)"
              exit 1
            fi
            NEW_VERSION="v${NEW_VERSION}"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            MAJOR="${LATEST_TAG#v}"; MAJOR="${MAJOR%%.*}"
            REST="${LATEST_TAG#v*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

            case "$BUMP_INPUT" in
              auto|"")
                if [ -z "$(git log --format=%H "${LATEST_TAG}..HEAD" 2>/dev/null)" ]; then
                  # Re-run after a partial failure: the tag sits at HEAD. Reuse
                  # it as the target so the release step completes it (or
                  # no-ops if it already exists).
                  PREV_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | sed -n 2p || true)
                  echo "new_version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
                  echo "No commits since ${LATEST_TAG} — reusing it"
                  exit 0
                fi
                LOG="$(git log --format=%B "${LATEST_TAG}..HEAD" 2>/dev/null || true)"
                if echo "$LOG" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!: '; then
                  LEVEL="major"
                elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?: '; then
                  LEVEL="minor"
                else
                  LEVEL="patch"
                fi
                ;;
              patch|minor|major) LEVEL="$BUMP_INPUT" ;;
              *) echo "Invalid bump input: ${BUMP_INPUT} (auto|patch|minor|major)"; exit 1 ;;
            esac

            case "$LEVEL" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LATEST_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION} (previous: ${LATEST_TAG:-none})"

      # Bump pyproject.toml version to match the tag. Idempotent — skips if
      # already at target (prevents empty-commit failures on re-runs and on the
      # push-triggered second run). The pushed commit re-triggers this
      # workflow; the tag-exists guard makes the second run a no-op.
      - name: Bump manifest version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          V="${VERSION#v}"
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" = "$V" ]; then
            echo "pyproject.toml already at $V — skipping"
            exit 0
          fi
          sed -i "s/^version = .*/version = \"$V\"/" pyproject.toml
          git add pyproject.toml
          git commit -m "chore(release): $VERSION"
          git push origin HEAD

      - name: Create and push tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build and push release Docker image
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          # The Dockerfile defines `ARG VERSION=devel` for version stamping;
          # pass the release version as a build arg.
          if [ "${{ steps.tag.outputs.created }}" = "true" ] || ! docker manifest inspect "${REGISTRY}:${VERSION}" >/dev/null 2>&1; then
            docker build --build-arg VERSION="${VERSION}" -t "${REGISTRY}:${VERSION}" .
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker push "${REGISTRY}:${VERSION}"
          else
            echo "Image ${REGISTRY}:${VERSION} already exists — skipping"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — nothing to do"
            exit 0
          fi
          # Annalist GitHub App fills the body via the release webhook
          # (fill-after mode). The App's URL is configured in App settings,
          # never in the repo.
          gh release create "${VERSION}" --title "Release ${VERSION}" --notes ""

  pypi:
    # Publish sdist + wheel to PyPI via Trusted Publishing (OIDC — no
    # API token stored). Idempotent: a version already on PyPI skips.
    # One-time repo setup: add a "Trusted Publisher" on pypi.org for
    # this project (owner=djdembeck, repo=media-archive-sync,
    # workflow=release.yml, environment=release).
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      id-token: write
    environment: release
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version_tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build
          python -m build

      - name: Verify built version matches tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version_tag }}"
          python - "$VERSION" <<'EOF'
          import pathlib, sys, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = sys.argv[1].lstrip("v")
          if version != tag:
              sys.exit(f"pyproject version {version!r} != tag {tag!r}")
          print(f"version {version} matches tag")
          EOF

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          # Trunk flow is idempotent (duplicate version-bump commit re-triggers
          # this workflow with the tag-exists guard); skip already-uploaded
          # files so reruns after a partial publish succeed.
          skip-existing: true
